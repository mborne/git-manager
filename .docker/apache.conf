# .docker/apache.conf : apache2 configuration for git-manager
#
# see https://symfony.com/doc/current/setup/web_server_configuration.html#apache

# avoid "Could not reliably determine the server's fully qualified domain name"
ServerName localhost

# hide apache version
ServerTokens Prod
ServerSignature Off

# mitigate httpoxy (CVE-2016-5385) as HTTP_PROXY is used to reach git hosting services
RequestHeader unset Proxy early

<VirtualHost *:${APACHE_PORT}>
	DocumentRoot /app/public

	<Directory /app/public>
		Require all granted
		AllowOverride None

		DirectoryIndex index.php
		# forward the requests which do not match a file to the symfony front controller
		FallbackResource /index.php
	</Directory>

	# only public/ is exposed
	<Directory /app>
		Require all denied
	</Directory>

	# send logs to stdout / stderr so that they are collected by docker
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
